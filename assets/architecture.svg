<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Business processes to technology capability</title>
  <desc id="description">The fifteen Microsoft Dynamics 365 end-to-end business process scenarios inform a solution architecture that brings together Dynamics 365, Power Platform, Azure integration, data and analytics, development, automation and testing, and AI agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B13"/>
      <stop offset=".55" stop-color="#071522"/>
      <stop offset="1" stop-color="#08101F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102538" stop-opacity=".94"/>
      <stop offset="1" stop-color="#091522" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="architecture" x1="40" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2938"/>
      <stop offset=".5" stop-color="#103047"/>
      <stop offset="1" stop-color="#171F3D"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#31BFFF" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#70DBFF"/>
      <stop offset="1" stop-color="#8C9BFF" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="matrix(540 0 0 285 600 292)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087CC3" stop-opacity=".18"/>
      <stop offset="1" stop-color="#087CC3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" stroke="#4CA7D1" stroke-opacity=".075"/>
      <circle cx="1" cy="1" r="1" fill="#51C9FF" fill-opacity=".18"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m1 1 7 4-7 4" stroke="#67D5FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="590" rx="22" fill="url(#background)"/>
  <rect width="1200" height="590" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="590" rx="22" fill="url(#ambient)"/>
  <path d="M40 105h1120M40 378h1120M40 550h1120" stroke="#55CFFF" stroke-opacity=".12"/>
  <path d="M40 0v590M1160 0v590" stroke="#55CFFF" stroke-opacity=".09"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="43" fill="#66CFFF" font-size="11" font-weight="700" letter-spacing="2.5">BUSINESS PROCESSES</text>
    <text x="600" y="74" fill="#F3F8FC" font-size="21" font-weight="650">Understand the work before designing the system</text>
    <text x="600" y="96" fill="#91AFC4" font-size="11" letter-spacing=".35">Microsoft Dynamics 365 end-to-end Business Process Catalog</text>

    <g font-size="11.5" font-weight="550">
      <g fill="url(#panel)" stroke="#3EBFFF" stroke-opacity=".52">
        <rect x="45" y="122" width="214" height="32" rx="8"/>
        <rect x="271" y="122" width="214" height="32" rx="8"/>
        <rect x="497" y="122" width="214" height="32" rx="8"/>
        <rect x="723" y="122" width="214" height="32" rx="8"/>
        <rect x="949" y="122" width="206" height="32" rx="8"/>
        <rect x="45" y="164" width="214" height="32" rx="8"/>
        <rect x="271" y="164" width="214" height="32" rx="8"/>
        <rect x="497" y="164" width="214" height="32" rx="8"/>
        <rect x="723" y="164" width="214" height="32" rx="8"/>
        <rect x="949" y="164" width="206" height="32" rx="8"/>
        <rect x="45" y="206" width="214" height="32" rx="8"/>
        <rect x="271" y="206" width="214" height="32" rx="8"/>
        <rect x="497" y="206" width="214" height="32" rx="8"/>
        <rect x="723" y="206" width="214" height="32" rx="8"/>
        <rect x="949" y="206" width="206" height="32" rx="8"/>
      </g>
      <g fill="#DFEDF6">
        <text x="152" y="142">Acquire to Dispose</text>
        <text x="378" y="142">Case to Resolution</text>
        <text x="604" y="142">Concept to Market</text>
        <text x="830" y="142">Design to Retire</text>
        <text x="1052" y="142">Forecast to Plan</text>
        <text x="152" y="184">Hire to Retire</text>
        <text x="378" y="184">Inventory to Deliver</text>
        <text x="604" y="184">Order to Cash</text>
        <text x="830" y="184">Plan to Produce</text>
        <text x="1052" y="184">Source to Pay</text>
        <text x="152" y="226">Project to Profit</text>
        <text x="378" y="226">Prospect to Quote</text>
        <text x="604" y="226">Record to Report</text>
        <text x="830" y="226">Service to Deliver</text>
        <text x="1052" y="226">Administer to Operate</text>
      </g>
    </g>

    <path d="M600 244v42" stroke="url(#flow)" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M600 246v36" stroke="#55CFFF" stroke-opacity=".3" stroke-width="7" filter="url(#glow)"/>

    <rect x="40" y="299" width="1120" height="66" rx="14" fill="url(#architecture)" stroke="#55CFFF" stroke-opacity=".68"/>
    <rect x="41" y="300" width="1118" height="64" rx="13" stroke="#C0EDFF" stroke-opacity=".08"/>
    <text x="600" y="326" fill="#F4FAFF" font-size="17" font-weight="700" letter-spacing="1.2">SOLUTION ARCHITECTURE</text>
    <text x="600" y="347" fill="#A6C2D4" font-size="11.5">Connect people, processes, platforms, data, and delivery into one supportable whole</text>

    <path d="M600 365v20m-492 0h984" stroke="url(#flow)" stroke-width="1.5"/>
    <g stroke="#57CFFF" stroke-opacity=".5" stroke-width="1.5">
      <path d="M108 385v16M272 385v16M436 385v16M600 385v16M764 385v16M928 385v16M1092 385v16"/>
    </g>
    <g fill="#5ED3FF">
      <circle cx="108" cy="385" r="3"/><circle cx="272" cy="385" r="3"/><circle cx="436" cy="385" r="3"/>
      <circle cx="600" cy="385" r="3"/><circle cx="764" cy="385" r="3"/><circle cx="928" cy="385" r="3"/><circle cx="1092" cy="385" r="3"/>
    </g>

    <g>
      <g transform="translate(30 401)">
        <rect width="156" height="124" rx="11" fill="url(#panel)" stroke="#3EBFFF" stroke-opacity=".65"/>
        <text x="78" y="32" fill="#F3F8FC" font-size="13" font-weight="700">Dynamics 365</text>
        <path d="M22 45h112" stroke="#4FCBFF" stroke-opacity=".34"/>
        <text x="78" y="67" fill="#9BB8CB" font-size="10.5">Finance · Supply Chain</text>
        <text x="78" y="85" fill="#9BB8CB" font-size="10.5">Commerce · Project Ops</text>
        <text x="78" y="108" fill="#4FCBFF" font-size="9" font-weight="700" letter-spacing="1">BUSINESS APPS</text>
      </g>
      <g transform="translate(194 401)">
        <rect width="156" height="124" rx="11" fill="url(#panel)" stroke="#3EBFFF" stroke-opacity=".65"/>
        <text x="78" y="32" fill="#F3F8FC" font-size="13" font-weight="700">Power Platform</text>
        <path d="M22 45h112" stroke="#4FCBFF" stroke-opacity=".34"/>
        <text x="78" y="67" fill="#9BB8CB" font-size="10.5">Apps · Automate · BI</text>
        <text x="78" y="85" fill="#9BB8CB" font-size="10.5">Dataverse · Copilot Studio</text>
        <text x="78" y="108" fill="#4FCBFF" font-size="9" font-weight="700" letter-spacing="1">LOW-CODE</text>
      </g>
      <g transform="translate(358 401)">
        <rect width="156" height="124" rx="11" fill="url(#panel)" stroke="#3EBFFF" stroke-opacity=".65"/>
        <text x="78" y="32" fill="#F3F8FC" font-size="13" font-weight="700">Integration + Azure</text>
        <path d="M22 45h112" stroke="#4FCBFF" stroke-opacity=".34"/>
        <text x="78" y="67" fill="#9BB8CB" font-size="10.5">APIs · OData · Data entities</text>
        <text x="78" y="85" fill="#9BB8CB" font-size="10.5">Dual-write · Migration</text>
        <text x="78" y="108" fill="#4FCBFF" font-size="9" font-weight="700" letter-spacing="1">CONNECT</text>
      </g>
      <g transform="translate(522 401)">
        <rect width="156" height="124" rx="11" fill="url(#panel)" stroke="#3EBFFF" stroke-opacity=".65"/>
        <text x="78" y="32" fill="#F3F8FC" font-size="13" font-weight="700">Data + Analytics</text>
        <path d="M22 45h112" stroke="#4FCBFF" stroke-opacity=".34"/>
        <text x="78" y="67" fill="#9BB8CB" font-size="10.5">SQL · ETL · Data models</text>
        <text x="78" y="85" fill="#9BB8CB" font-size="10.5">Power Query · Reporting</text>
        <text x="78" y="108" fill="#4FCBFF" font-size="9" font-weight="700" letter-spacing="1">MAKE VISIBLE</text>
      </g>
      <g transform="translate(686 401)">
        <rect width="156" height="124" rx="11" fill="url(#panel)" stroke="#3EBFFF" stroke-opacity=".65"/>
        <text x="78" y="32" fill="#F3F8FC" font-size="13" font-weight="700">Development</text>
        <path d="M22 45h112" stroke="#4FCBFF" stroke-opacity=".34"/>
        <text x="78" y="67" fill="#9BB8CB" font-size="10.5">Python · TypeScript</text>
        <text x="78" y="85" fill="#9BB8CB" font-size="10.5">React · JavaScript</text>
        <text x="78" y="108" fill="#4FCBFF" font-size="9" font-weight="700" letter-spacing="1">BUILD</text>
      </g>
      <g transform="translate(850 401)">
        <rect width="156" height="124" rx="11" fill="url(#panel)" stroke="#3EBFFF" stroke-opacity=".65"/>
        <text x="78" y="32" fill="#F3F8FC" font-size="13" font-weight="700">Automation + QA</text>
        <path d="M22 45h112" stroke="#4FCBFF" stroke-opacity=".34"/>
        <text x="78" y="67" fill="#9BB8CB" font-size="10.5">Workflows · Deterministic</text>
        <text x="78" y="85" fill="#9BB8CB" font-size="10.5">Testing · Release</text>
        <text x="78" y="108" fill="#4FCBFF" font-size="9" font-weight="700" letter-spacing="1">MAKE REPEATABLE</text>
      </g>
      <g transform="translate(1014 401)">
        <rect width="156" height="124" rx="11" fill="#111B38" stroke="#8292FF" stroke-opacity=".82"/>
        <text x="78" y="32" fill="#F3F4FF" font-size="13" font-weight="700">AI + Agents</text>
        <path d="M22 45h112" stroke="#A2ACFF" stroke-opacity=".38"/>
        <text x="78" y="67" fill="#B8C0DA" font-size="10.5">MCP · Orchestration</text>
        <text x="78" y="85" fill="#B8C0DA" font-size="10.5">Human in the loop</text>
        <text x="78" y="108" fill="#A7B2FF" font-size="9" font-weight="700" letter-spacing="1">EARN THE CALL</text>
      </g>
    </g>

    <text x="600" y="564" fill="#B7CADA" font-size="12" letter-spacing=".2">Start with business outcomes. Choose the right technology for the work.</text>
  </g>
</svg>
